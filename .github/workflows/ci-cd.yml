name: Django CI/CD

on:
  push:
    branches: [ develop, homework-35.2 ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        SECRET_KEY: "test-secret-key-for-ci-12345"
        DEBUG: "True"
        ALLOWED_HOSTS: "localhost,127.0.0.1"
        DB_ENGINE: "django.db.backends.sqlite3"
        DB_NAME: "test_db.sqlite3"
      run: |
        python manage.py migrate
        python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/test/myapp
          git pull origin develop
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          export SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"
          export DEBUG="${{ secrets.DJANGO_DEBUG }}"
          export ALLOWED_HOSTS="${{ secrets.DJANGO_ALLOWED_HOSTS }}"
          export STATIC_ROOT="/home/test/myapp/static"
          python manage.py migrate
          python manage.py collectstatic --noinput
          sudo systemctl restart myapp